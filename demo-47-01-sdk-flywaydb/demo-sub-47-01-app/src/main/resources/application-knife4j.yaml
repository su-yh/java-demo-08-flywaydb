

knife4j:
  enable: false
  setting:
    language: zh_cn


# swagger 页面访问： http://localhost:${server.servlet.context-path}/doc.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    # 分组信息也可以在这里配置，在代码的配置类里面配置也是可以的。
    - group: 'ruoyi-system-user'
      paths-to-match:
        - "/system/user/**"
      packages-to-scan:
        - "com.ebusiness.rouyi.controller"
    - group: 'ruoyi-system-online'
      paths-to-match:
        - "/system/online/**"
      packages-to-scan:
        - "com.ebusiness.rouyi.controller"
    - group: 'ruoyi-system-role'
      paths-to-match:
        - "/system/role/**"
      packages-to-scan:
        - "com.ebusiness.rouyi.controller"
    - group: 'ruoyi-system-menu'
      paths-to-match:
        - "/system/menu/**"
      packages-to-scan:
        - "com.ebusiness.rouyi.controller"
    - group: 'user'
      paths-to-match:
        - "/user/**"
      packages-to-scan:
        - "com.ebusiness.system.controller"
    - group: 'file-system'
      paths-to-match:
        - "/system/file/**"
      packages-to-scan:
        - "com.ebusiness.system.controller"
    - group: "drop-down"
      paths-to-match:
        - "/dropDown/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "exception-order"
      paths-to-match:
        - "/exception/order/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "order"
      paths-to-match:
        - "/order/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "smart-sms"
      paths-to-match:
        - "/smart/sms/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: 'email-record'
      paths-to-match:
        - "/email/record/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "statistic"
      paths-to-match:
        - "/statistic/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "support-team"
      paths-to-match:
        - "/support/team/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "vip"
      paths-to-match:
        - "/vip/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "weight-config"
      paths-to-match:
        - "/weight/config/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "ocr"
      paths-to-match:
        - "/ocr/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "vip-remittance"
      paths-to-match:
        - "/vipRemittance/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"
    - group: "agent-level-data"
      paths-to-match:
        - "/agent/level/data/**"
      packages-to-scan:
        - "com.ebusiness.business.controller"

---
spring:
  config:
    activate:
      on-profile: suyh,suyh_dev,dev

knife4j:
  enable: true

---
spring:
  config:
    activate:
      on-profile: wtdev

knife4j:
  enable: true



